# IRHub BME280(温湿度気圧)。I2Cバス(irhub-i2c.yaml)込み。
# irhub-common.yaml / irhub-node-c6-desk.yaml / irhub-node-c6-calib.yaml からincludeされる。
# ADT7410等、他のI2Cセンサーを足すノードは include元の`sensor:`に追記すればよい
# (sensor:リストはパッケージ間で連結される)。

packages:
  i2c: !include irhub-i2c.yaml

# 同じノードに複数個載せる場合は、2個目以降を`!include`の`vars:`で
# 番号(とアドレス)を変えてincludeする(name:/id:の末尾の番号が変わるので
# HA側のunique_idも衝突しない)。省略時は下のデフォルト(1個目)になる:
#   packages:
#     bme280: !include irhub-bme280.yaml               # bme280_1, 0x76
#     bme280_2: !include
#       file: irhub-bme280.yaml
#       vars: {bme280_n: "2", bme280_address: "0x77"}  # bme280_2, 0x77
substitutions:
  bme280_n: "1"
  bme280_address: "0x76"

sensor:
  # Bosch BME280 (温度・湿度・気圧、ESPHome標準コンポーネント)。
  # デフォルトアドレス0x77(SDOピンをGNDに繋ぐと0x76になる基板が多い、
  # 配線に合わせて変更すること)。温度・湿度・気圧はそれぞれ個別の
  # HAエンティティとして公開される(sub-sensorを省略すればその項目だけ
  # 無効化できる)。まだ実機未投入の新規センサーなので、ここでの
  # name:は自由に決めてよい(ADT7410の"Temperature"と紛らわしくない
  # ように分けてある)。
  # irhub-common.yamlのlogger:にBME280のタグだけVERBOSEを指定すればログに出るようになります:
  # logger:
  #   logs:
  #     bme280_base: VERBOSE

  - platform: bme280_i2c
    address: ${bme280_address}
    update_interval: 60s
    # ノード側から`- id: !extend bme280_1`で補正(filters)を足すためのid。
    # 補正値はセンサー個体ごとに違うので、このパッケージには書かない。
    # (filters:はリストなので!extendでも上書きではなく連結になる。ここで
    #  空にしておけば、ノード側に書いたものだけが効く)
    id: bme280_${bme280_n}
    temperature:
      name: "BME280 Temperature ${bme280_n}"
      id: bme280_temperature_${bme280_n}
    humidity:
      name: "BME280 Humidity ${bme280_n}"
      id: bme280_humidity_${bme280_n}
    pressure:
      name: "BME280 Pressure ${bme280_n}"
      id: bme280_pressure_${bme280_n}
