# IRHub ESPHomeノード 共通設定
#
# ボード(esp32:)とネットワーク(wifi: or openthread:)以外の全設定を
# ここに集約し、チップ別ファイル(irhub-node-c5.yaml / irhub-node-c6.yaml /
# irhub-node-c5-thread.yaml等)から `packages:` で読み込む。
# ネットワーク設定は irhub-network-wifi.yaml / irhub-network-thread.yaml に
# 分離してあり、各ノードYAML側でどちらか一方を選んでincludeする
# (詳細: mds/2026-09-12_IRHub-thread-investigation.md)。
#
# 想定ハードウェア(適当接続の仮定):
#   - 赤外線受信モジュール(38kHz, 例: OSRB38C9AA/VS1838B等) -> ir_receiver_pin
#   - 赤外線LED(トランジスタ/FET駆動, RMT出力) -> ir_transmitter_pin
#   - ステータスLED(単色, 例: オンボードLEDやGPIO直結LED) -> status_led_pin
#   下のsubstitutionsはあくまでフォールバック値。実際のピンは
#   irhub-node-c5.yaml / irhub-node-c6.yaml 側でチップごとに上書きしている
#   (XIAO ESP32C5/C6はピン番号(GPIOxx)がシルク印刷のD0-D10表記と一致せず、
#    かつC5とC6でストラッピングピンの位置が異なるため)。
#   C6のストラッピングピン: GPIO4,5,8,9,15(旧デフォルトのGPIO4/5/8と丸被り
#   していて、リセット時の再起動ループの原因になっていた)。
#   C5のストラッピングピン: GPIO7,25,26,27,28,MTMS,MTDI。
#   新しくピンを変える場合は、使うチップのストラッピングピンと
#   XIAOのピンアウト図を必ず確認すること。
#
# ネットワーク認証情報の扱い: irhub-network-wifi.yaml /
#   irhub-network-thread.yaml のコメント参照。
#
# 未検証ポイント(実機で要確認):
#   - pin番号/active-highかlow(inverted)か
#   - api:services: の `int[]` 引数と remote_transmitter.transmit_raw の型整合
#   - homeassistant.event: の event_data 値としてカンマ区切り文字列を送る方式で
#     HA側(custom_components/irhub)が期待通りパースできるか
#   - improv_serialでのプロビジョニング手順そのもの(実機で未実施)

substitutions:
  name: "irhub-node"
  friendly_name: "IRHub"
  ir_receiver_pin: "GPIO4"
  ir_transmitter_pin: "GPIO5"
  status_led_pin: "GPIO8"
  # I2Cセンサ拡張用(下記参照)。フォールバック値なので、実際のピンは
  # irhub-node-c5.yaml / irhub-node-c6.yaml 側でチップごとに上書きしている。
  i2c_sda_pin: "GPIO6"
  i2c_scl_pin: "GPIO7"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# --- 基本インフラ ---
# wifi:/improv_serial: または network:/openthread: は
# irhub-network-wifi.yaml / irhub-network-thread.yaml側で定義する
# (各ノードYAMLのpackages:でどちらか一方をinclude)。

logger:
  # improv_serialはこのUARTロガー経由でシリアル通信する。

# preferences(flashへの状態保存)のデフォルトは60秒間隔のバッチ書き込み。
# ソフト処理を挟まないハードリセット(RSTボタン=EN直落とし)だと、直前の
# トグルがまだflashに書き込まれておらず消えることがあるため即時書き込みに
# 変更する(0s = 毎ループ、変更があれば即書き込み)。書き込み頻度自体は
# 低い(LEDトグル・起動カウンタ程度)想定なのでflash摩耗のリスクは小さい。
preferences:
  flash_write_interval: 0s

api:
  encryption:
    key: !secret api_encryption_key
  services:
    # HA側から `esphome.${name}_send_raw` として呼べるカスタムサービス。
    # 学習済みの生タイミング配列(int配列, us単位, 符号でmark/space)をそのまま送信する。
    - service: send_raw
      variables:
        data: int[]
      then:
        - remote_transmitter.transmit_raw:
            transmitter_id: ir_tx
            code: !lambda "return data;"
            # carrier_frequencyを省略すると0Hz(=無変調のただのON/OFF)になり、
            # 一般的な38kHz復調型のIR受信機では信号として認識されない。
            # remote_receiverは受信時に既に復調済みの包絡線だけを記録して
            # いるので、送信時に改めて変調をかけ直す必要がある。
            carrier_frequency: 38kHz

ota:
  - platform: esphome

# デバッグ用。安定してきたら外してよい。
web_server:
  version: 3

# --- 赤外線受信 ---
remote_receiver:
  id: ir_rx
  pin:
    number: ${ir_receiver_pin}
    inverted: true
  dump: raw
  # 受信した生タイミングをそのままHAのイベントバスへ転送する。
  # custom_components/irhub 側が `esphome.${name}_ir_raw_received` を
  # 学習(learn_command)のトリガーとして購読する想定。
  on_raw:
    then:
      - homeassistant.event:
          event: esphome.${name}_ir_raw_received
          data:
            raw: !lambda |-
              std::string s;
              for (auto v : x) {
                if (!s.empty()) s += ",";
                s += to_string(v);
              }
              return s;

# --- 赤外線送信 ---
remote_transmitter:
  id: ir_tx
  pin: ${ir_transmitter_pin}
  carrier_duty_percent: 50%

# --- ステータスLED ---
output:
  - platform: gpio
    pin: ${status_led_pin}
    id: status_led_output

light:
  # 単純なGPIO直結LED(PWM調光なし)なのでbinaryプラットフォームを使う。
  # 調光したい場合はoutputをledc(PWM)にした上でmonochromaticに変更する。
  - platform: binary
    output: status_led_output
    name: "Status LED"
    id: status_led
    # restore_mode省略時のデフォルトはALWAYS_OFFで、再起動のたびに状態が
    # 揮発する(=OFFに戻る)。前回の状態をNVSから復元するように変更。
    # (初回起動時など保存済み状態が無ければOFFにフォールバック)
    restore_mode: RESTORE_DEFAULT_OFF
    # TODO: 受信中/送信中にblinkさせる等はPhase 2以降で automation として追加

# --- I2Cセンサ拡張 ---
# 1本のバス(SDA/SCL 2ピン)にアドレスさえ被らなければ何個でもデバイスを
# 追加できる。センサーを増やす場合は下の`sensor:`にプラットフォームを
# 追記していくだけでよい(ピンは増えない)。
# SPIデバイスを追加したい場合は別途`spi:`を宣言し、CLK/MOSI/MISOは共有
# できるが、デバイスごとにCS(チップセレクト)ピンが1本ずつ追加で必要になる
# 点がI2Cと異なる(ピンの余裕と要相談)。
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true  # 起動時ログにバス上の全デバイスアドレスを列挙(配線確認用)

# adt7410はESPHome標準コンポーネントに無いため自前実装
# (external_components/adt7410/参照)。
external_components:
  - source:
      type: local
      path: external_components
    components: [adt7410]

sensor:
  # Analog Devices ADT7410 (高精度I2C温度センサ、湿度は非対応)。
  # デフォルトアドレス0x48(ADDR0/ADDR1ピンの結線で0x48〜0x4Bまで変更可)。
  # 他のI2C/SPIセンサを追加する場合もこの`sensor:`リストに項目を
  # 足していくだけでよい(下のBME280が実例)。アドレスさえ被らなければ
  # 同じI2Cバスに何個でも共存できる(ADT7410=0x48、BME280=0x76/0x77で
  # 元々被らない)。
  - platform: adt7410
    name: "ADT7410 Temperature"
    id: adt7410_temperature
    address: 0x48
    update_interval: 60s

  # Bosch BME280 (温度・湿度・気圧、ESPHome標準コンポーネント)。
  # デフォルトアドレス0x77(SDOピンをGNDに繋ぐと0x76になる基板が多い、
  # 配線に合わせて変更すること)。温度・湿度・気圧はそれぞれ個別の
  # HAエンティティとして公開される(sub-sensorを省略すればその項目だけ
  # 無効化できる)。ADT7410と同時に接続した場合、HA側には「ADT7410
  # Temperature」と「BME280 Temperature」の2つの気温センサーが別々に
  # 見える(名前を変えているのは見分けるため。地味に重要)。
  - platform: bme280_i2c
    address: 0x77
    update_interval: 60s
    temperature:
      name: "BME280 Temperature"
      id: bme280_temperature
    humidity:
      name: "BME280 Humidity"
      id: bme280_humidity
    pressure:
      name: "BME280 Pressure"
      id: bme280_pressure
