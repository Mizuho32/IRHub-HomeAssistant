# IRHub ESPHomeノード 共通設定
#
# ボード(esp32:)とネットワーク(wifi: or openthread:)以外の全設定を
# ここに集約し、チップ別ファイル(irhub-node-c5.yaml / irhub-node-c6.yaml /
# irhub-node-c5-thread.yaml等)から `packages:` で読み込む。
# ネットワーク設定は irhub-network-wifi.yaml / irhub-network-thread.yaml に
# 分離してあり、各ノードYAML側でどちらか一方を選んでincludeする
# (詳細: mds/2026-09-12_IRHub-thread-investigation.md)。
#
# 想定ハードウェア(適当接続の仮定):
#   - 赤外線受信モジュール(38kHz, 例: OSRB38C9AA/VS1838B等) -> ir_receiver_pin
#   - 赤外線LED(トランジスタ/FET駆動, RMT出力) -> ir_transmitter_pin
#   - ステータスLED(単色, 例: オンボードLEDやGPIO直結LED) -> status_led_pin
#   各パッケージ(とこのファイル)のsubstitutionsはあくまでフォールバック値。
#   実際のピンは irhub-node-c5.yaml / irhub-node-c6.yaml 側でチップごとに上書きしている
#   (XIAO ESP32C5/C6はピン番号(GPIOxx)がシルク印刷のD0-D10表記と一致せず、
#    かつC5とC6でストラッピングピンの位置が異なるため)。
#   C6のストラッピングピン: GPIO4,5,8,9,15(旧デフォルトのGPIO4/5/8と丸被り
#   していて、リセット時の再起動ループの原因になっていた)。
#   C5のストラッピングピン: GPIO7,25,26,27,28,MTMS,MTDI。
#   新しくピンを変える場合は、使うチップのストラッピングピンと
#   XIAOのピンアウト図を必ず確認すること。
#
# ネットワーク認証情報の扱い: irhub-network-wifi.yaml /
#   irhub-network-thread.yaml のコメント参照。
#
# 未検証ポイント(実機で要確認):
#   - pin番号/active-highかlow(inverted)か
#   - api:services: の `int[]` 引数と remote_transmitter.transmit_raw の型整合
#   - homeassistant.event: の event_data 値としてカンマ区切り文字列を送る方式で
#     HA側(custom_components/irhub)が期待通りパースできるか
#   - improv_serialでのプロビジョニング手順そのもの(実機で未実施)

# 実体は以下のパッケージに分割してある(機能を絞ったノードは個別にincludeする):
#   irhub-base.yaml   : esphome/logger/preferences/api/ota/web_server
#   irhub-ir.yaml     : IR送受信 + send_rawサービス
#   irhub-bme280.yaml : I2Cバス + BME280
packages:
  base: !include irhub-base.yaml
  ir: !include irhub-ir.yaml
  bme280: !include irhub-bme280.yaml

substitutions:
  status_led_pin: "GPIO8"

# --- ステータスLED ---
output:
  - platform: gpio
    pin: ${status_led_pin}
    id: status_led_output

light:
  # 単純なGPIO直結LED(PWM調光なし)なのでbinaryプラットフォームを使う。
  # 調光したい場合はoutputをledc(PWM)にした上でmonochromaticに変更する。
  - platform: binary
    output: status_led_output
    name: "Status LED"
    id: status_led
    # restore_mode省略時のデフォルトはALWAYS_OFFで、再起動のたびに状態が
    # 揮発する(=OFFに戻る)。前回の状態をNVSから復元するように変更。
    # (初回起動時など保存済み状態が無ければOFFにフォールバック)
    restore_mode: RESTORE_DEFAULT_OFF
    # TODO: 受信中/送信中にblinkさせる等はPhase 2以降で automation として追加

# adt7410はESPHome標準コンポーネントに無いため自前実装
# (external_components/adt7410/参照)。
external_components:
  - source:
      type: local
      path: external_components
    components: [adt7410]

sensor:
  # Analog Devices ADT7410 (高精度I2C温度センサ、湿度は非対応)。
  # デフォルトアドレス0x48(ADDR0/ADDR1ピンの結線で0x48〜0x4Bまで変更可)。
  # 他のI2C/SPIセンサを追加する場合もこの`sensor:`リストに項目を
  # 足していくだけでよい(下のBME280が実例)。アドレスさえ被らなければ
  # 同じI2Cバスに何個でも共存できる(ADT7410=0x48、BME280=0x76/0x77で
  # 元々被らない)。
  #
  # name:は"Temperature"のまま(実機で既に稼働中のため変更しない)。
  # ESPHomeの`name:`はHA側unique_idの一部になるため、ここを変えると
  # HA上で別エンティティ扱いになり履歴が途切れる
  # (詳細: mds/2026-09-13_IRHub-esphome-tips.md)。BME280と並べて
  # 見分けたい場合は、ESPHome側ではなくHA側(設定 > エンティティ)で
  # 表示名だけリネームすること。
  - platform: adt7410
    name: "Temperature"
    id: adt7410_temperature
    address: 0x48
    update_interval: 60s

  # BME280本体はirhub-bme280.yaml。ここではこのノード(c5/c6共通配線)に
  # 付いている個体の補正だけを足す。
  - id: !extend bme280_1
    temperature:
      # ADT7410/市販温度計との比較でBME280が低めに出る(2026-09-14実測:
      # ADT7410=27.89, 市販温度計=27.6, BME280=27.2)。BME280はdatasheet上も
      # 温度精度が±1℃程度(湿度・気圧優先の複合センサ)で、工場校正済みの
      # ADT7410の方が信頼できるため、ADT7410を基準にoffsetで補正する
      # (表示値 = センサ値 + offset)。
      # 1点補正なので温度域が変わると誤差が変わる可能性あり。別の温度帯でも
      # 実測できたらcalibrate_linear:(2点以上)に切り替えて精度を上げること。
      # calibrate_linear:を使う場合のサンプル(2点以上の実測ペアから線形回帰、
      # 全域で1点offsetより高精度。例: 低温側と高温側でそれぞれADT7410と
      # 比較実測して置き換える):
      #   filters:
      #     - calibrate_linear:
      #         - 27.2 -> 27.9   # 室温付近(今回の実測点)
      #         - 10.0 -> 10.6   # 別の温度帯(例: 冬場や冷蔵庫近くで実測して埋める)
      filters:
        - offset: 0.7
    #humidity:
    #  filters:
    #    #- offset: -2
    #    - calibrate_linear:
    #        - 66.9 -> 61     # BME280が64.9%と表示した時、真値(基準)は61%だった。offset乗ってないか注意
    #        - 77 -> 75
