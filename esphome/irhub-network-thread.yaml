# Threadネットワーク構成(実験版)。
#
# irhub-network-wifi.yamlの代わりにこちらをpackages:に含めることで、
# IRHubノードをWiFiではなくThreadメッシュ経由でHAに接続する。
# 調査の経緯・トレードオフは mds/2026-09-12_IRHub-thread-investigation.md 参照。
#
# 前提:
#   - `wifi:`とは排他(ESPHome側の制約、CONFLICTS_WITH)。WiFi版ノードとは
#     別バイナリになる。
#   - ESP32-C5/C6のみ対応(802.15.4無線が無いチップでは使えない)。
#   - esp32: framework: esp-idf が必須(Arduinoコア非対応。各ノードYAMLで
#     既に設定済み)。
#
# 認証情報(Operational Dataset)の入手方法:
#   improv_serialのような実行時プロビジョニング手段が無く、コンパイル時に
#   secrets.yaml経由で埋め込む(tlv:)。値はHAの
#   `設定 > システム > ネットワーク > Thread` タブで対象ネットワークの
#   詳細を開くと出てくる `Active dataset TLVs: ...` をそのままコピーする
#   (同じ値は `docker exec -it addon_core_openthread_border_router
#   ot-ctl dataset active -x` でも取得できるが、HAのUIだけで完結するので
#   SSH/dockerは不要)。
#
# network: enable_ipv6はopenthread:の必須要件(final_validateでチェックされる)。
network:
  enable_ipv6: true

openthread:
  # 実験: FTD(常時RX、無線が眠れない)だと消費電力がWiFi版の約2.7倍
  # (0.12W→0.33W)になることを実機で確認。MTD+poll_periodならポーリング
  # 間隔の間だけ無線を寝かせられるので省電力になるはずだが、HA→ESP32方向の
  # 通信(IR送信コマンド等)は次のポーリングまで最大poll_period分の遅延が
  # 乗る(SEDと同じ理屈)。poll_period: 1sで様子見。
  # 前の値(FTD、常時起動・低遅延優先): device_type: FTD (poll_periodなし)
  device_type: MTD
  poll_period: 1s
  tlv: !secret thread_dataset_tlv
