# XIAO ESP32-C6向けエントリポイント。
# `esphome run irhub-node-c6.yaml` / `esphome compile irhub-node-c6.yaml` で使う。

packages:
  common: !include irhub-common.yaml
  network: !include irhub-network-wifi.yaml

substitutions:
  name: "irhub-node-c6"
  # XIAO ESP32-C6のストラッピングピン(GPIO4,5,8,9,15)を避けて選定。
  # (共通デフォルトのGPIO4/5/8は全てC6のストラッピングピンで、リセット時の
  #  再起動ループの原因になっていたため上書きする)
  # XIAO D-pin対応: D0=GPIO0, D1=GPIO1, D2=GPIO2 (いずれも非ストラッピング)
  ir_receiver_pin: "GPIO0"    # D0
  ir_transmitter_pin: "GPIO1" # D1
  status_led_pin: "GPIO2"     # D2
  # I2Cセンサ(ADT7410等)用。空いている非ストラッピングピンを割り当てただけで、
  # XIAOのシルク印刷ピン番号(Dx)との対応は未確認。実配線前にピンアウト図で要確認。
  i2c_sda_pin: "GPIO19"
  i2c_scl_pin: "GPIO20"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
    # OpenThreadはArduinoコアでは使えずesp-idf限定のため、
    # 将来Thread対応する前提でesp-idfに固定しておく。
