# IRHub 用の軽量ダッシュボード例
#
# Developer Toolsを使わずに「新しい信号を学習する」「学習済みの信号を送る」
# 「名前を変える」「削除する」をダッシュボードから行えるようにするための最小構成。
#
# 対象デバイス(entity_id)はscript側にハードコードせず、ドロップダウン
# (`select.irhub_target_device`)から選ぶ方式にしてある。選択肢は
# `integration_entities('irhub')` というJinja関数でIRHub統合に属する
# 全remoteエンティティを自動列挙しているので、IRHubノードを追加/削除しても
# このダッシュボード・スクリプト側は一切編集不要。
#
# 使い方:
#   1. 下記の`input_text:`/`template:`/`script:`セクションを
#      configuration.yaml に追記する。
#      (template selectはGUIのHelpers画面からは作れないため、YAML必須)
#   2. 一番下の `views:` 以下をダッシュボードに追加する
#      (既存ダッシュボードの編集 > 右上メニュー > YAMLを編集、で貼り付けるか、
#      新しいダッシュボードを「YAMLで編集」モードで作る)。
#   3. ダッシュボードを開き、「対象デバイス」ドロップダウンでIRHubノードを
#      選んでから、学習/送信/リネーム/削除を行う
#      (未選択の場合は最初に見つかったIRHubデバイスが自動的に使われる)。
#
# 「コマンド名」欄は学習・送信・削除・リネーム(変更前)の対象名として共通で使う。
# リネームだけ「新しい名前」欄が別途必要。既知のコマンド一覧は
# 選択中のremoteエンティティの`commands`属性(custom_components/irhub側で
# 追加済み)をMarkdownカードで表示する。
# 削除・リネームは custom_components/irhub が追加するカスタムサービス
# `irhub.delete_command` / `irhub.rename_command` を使う(標準の`remote`
# ドメインには削除/リネーム機能が無いため)。

# --- configuration.yaml に追記するもの (helpers) ---
input_text:
  irhub_command_name:
    name: "IRHub コマンド名"
    max: 50
  irhub_new_command_name:
    name: "IRHub 新しい名前(リネーム用)"
    max: 50
  irhub_target_entity:
    name: "IRHub 対象デバイス(内部用、直接編集しなくてよい)"
    max: 255

# --- configuration.yaml に追記するもの (対象デバイス選択用のTemplate Select) ---
# 複数のIRHubノードを追加しても、ここでドロップダウンから選べるようにする。
# 選択状態自体はinput_text.irhub_target_entityに保存する
# (input_selectだと選択肢を動的に増減させるのに別途automationが要るため、
#  常に最新のIRHub一覧を出せるtemplate selectを使っている)。
#
# 注意: input_text/scriptと違い、templateエンティティのentity_idは
# YAMLのキーではなく`name:`から自動生成される。日本語名を使うと
# HAのローマ字化(slugify)がおかしな変換をすることがある
# (例: 「対象デバイス」→ `dui_xiang_tehaisu` のような中国語ピンイン風の
# 文字列になり、下のダッシュボードカードが参照する`select.irhub_target_device`
# と一致しなくなる)。そのため`name:`は英語にしておく。
# (表示名を日本語にしたい場合は、作成後にUI側でエンティティ名だけ
# 変更する分には問題ない。ズレるのはentity_id生成時だけ)
template:
  - select:
      - name: "IRHub Target Device"
        unique_id: irhub_target_device_select
        icon: mdi:remote
        state: "{{ states('input_text.irhub_target_entity') }}"
        options: "{{ integration_entities('irhub') }}"
        select_option:
          - service: input_text.set_value
            target:
              entity_id: input_text.irhub_target_entity
            data:
              value: "{{ option }}"

# --- configuration.yaml に追記するもの (scripts) ---
# entity_idは選択中のデバイス(未選択なら最初に見つかったIRHubデバイス)を
# テンプレートで解決する。ハードコードしない。
script:
  irhub_learn_command:
    alias: "IRHub: 学習する"
    icon: mdi:remote-tv
    sequence:
      - service: remote.learn_command
        target:
          entity_id: >-
            {{ states('input_text.irhub_target_entity')
               | default(integration_entities('irhub') | first, true) }}
        data:
          command: "{{ states('input_text.irhub_command_name') }}"
          timeout: 15

  irhub_send_command:
    alias: "IRHub: 送信する"
    icon: mdi:remote
    sequence:
      - service: remote.send_command
        target:
          entity_id: >-
            {{ states('input_text.irhub_target_entity')
               | default(integration_entities('irhub') | first, true) }}
        data:
          command: "{{ states('input_text.irhub_command_name') }}"

  irhub_delete_command:
    alias: "IRHub: 削除する"
    icon: mdi:delete
    sequence:
      - service: irhub.delete_command
        target:
          entity_id: >-
            {{ states('input_text.irhub_target_entity')
               | default(integration_entities('irhub') | first, true) }}
        data:
          command: "{{ states('input_text.irhub_command_name') }}"

  irhub_rename_command:
    alias: "IRHub: リネームする"
    icon: mdi:rename-box
    sequence:
      - service: irhub.rename_command
        target:
          entity_id: >-
            {{ states('input_text.irhub_target_entity')
               | default(integration_entities('irhub') | first, true) }}
        data:
          old_name: "{{ states('input_text.irhub_command_name') }}"
          new_name: "{{ states('input_text.irhub_new_command_name') }}"

# --- ダッシュボードのビューに追加するもの (Lovelace) ---
views:
  - title: IRHub
    path: irhub
    cards:
      - type: entities
        title: IRHub 操作
        entities:
          - entity: select.irhub_target_device
            name: "対象デバイス"
          - entity: input_text.irhub_command_name
            name: "コマンド名"
          - entity: input_text.irhub_new_command_name
            name: "新しい名前(リネーム用)"
          - entity: script.irhub_learn_command
            name: "学習する(15秒以内にリモコンを押す)"
          - entity: script.irhub_send_command
            name: "送信する"
          - entity: script.irhub_rename_command
            name: "リネームする"
          - entity: script.irhub_delete_command
            name: "削除する"
      - type: markdown
        title: 学習済みコマンド一覧
        content: >
          {% set target = states('input_text.irhub_target_entity')
             | default(integration_entities('irhub') | first, true) %}
          {% set cmds = state_attr(target, 'commands') %}
          {% if cmds %}
          {{ cmds | join(', ') }}
          {% else %}
          (まだ何も学習していません)
          {% endif %}
